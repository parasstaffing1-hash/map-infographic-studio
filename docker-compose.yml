name: map-studio

x-platform-environment: &platform-environment
  NODE_ENV: production
  REDIS_URL: redis://redis:6379
  API_KEYS: ${API_KEYS:-local-development-key}
  INTERNAL_RENDER_TOKEN: ${INTERNAL_RENDER_TOKEN:-local-renderer-token}
  CORS_ORIGINS: http://127.0.0.1:4174,http://localhost:4174
  MANIFEST_ALLOWED_HOSTS: host.docker.internal,minio,localhost,127.0.0.1
  WEB_APP_URL: http://web
  RENDERER_URL: http://renderer:8788
  S3_BUCKET: map-studio-renders
  S3_REGION: us-east-1
  S3_ENDPOINT: http://minio:9000
  # The endpoint a BROWSER can reach. Presigned download URLs are signed against
  # this, so an internal container hostname never escapes to the client.
  S3_PUBLIC_ENDPOINT: http://127.0.0.1:9000
  S3_FORCE_PATH_STYLE: "true"
  S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-mapstudio}
  S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-mapstudio-local-only}
  AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-mapstudio}
  AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-mapstudio-local-only}
  # Accounts, workspaces and projects.
  DATABASE_URL: postgres://${POSTGRES_USER:-mapstudio}:${POSTGRES_PASSWORD:-mapstudio-local-only}@postgres:5432/${POSTGRES_DB:-mapstudio}
  APP_BASE_URL: http://127.0.0.1:4174
  APP_API_PUBLIC_URL: http://127.0.0.1:8787
  DOWNLOAD_URL_TTL_SECONDS: "900"
  # Shared by the API (enqueues) and the video worker (consumes) - these must match.
  VIDEO_QUEUE_NAME: map-studio-video-jobs
  # Retained for compatibility only. Download links are now short-lived
  # presigned URLs minted per request; the bucket is never public.
  PUBLIC_DOWNLOAD_BASE_URL: http://127.0.0.1:8787/downloads
  VIDEO_JOBS_PER_KEY_PER_HOUR: "60"
  BATCH_JOBS_PER_KEY_PER_HOUR: "120"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "4174:80"
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: services/render-platform/Dockerfile
    command: ["node", "services/render-platform/dist/server.js"]
    environment: *platform-environment
    ports:
      - "8787:8787"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: services/render-platform/Dockerfile
    command: ["node", "services/render-platform/dist/shard-worker.js"]
    environment: *platform-environment
    depends_on:
      redis:
        condition: service_healthy
      renderer:
        condition: service_started
    deploy:
      replicas: 2
    restart: unless-stopped

  video-worker:
    build:
      context: .
      dockerfile: services/render-platform/Dockerfile
    command: ["node", "services/render-platform/dist/video-worker.js"]
    environment:
      <<: *platform-environment
      FFMPEG_PATH: /usr/bin/ffmpeg
      VIDEO_WORKER_CONCURRENCY: "2"
      VIDEO_ENCODE_TIMEOUT_MS: "600000"
    shm_size: 1gb
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      web:
        condition: service_started
    restart: unless-stopped

  renderer:
    build:
      context: .
      dockerfile: services/render-platform/Dockerfile
    command: ["node", "services/render-platform/dist/renderer.js"]
    environment: *platform-environment
    shm_size: 1gb
    depends_on:
      minio:
        condition: service_healthy
      web:
        condition: service_started
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mapstudio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mapstudio-local-only}
      POSTGRES_DB: ${POSTGRES_DB:-mapstudio}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      # Host port is configurable: a locally installed PostgreSQL commonly owns
      # 5432 and would otherwise shadow this container for host connections.
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mapstudio} -d ${POSTGRES_DB:-mapstudio}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-mapstudio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-mapstudio-local-only}
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: ["mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD && mc mb --ignore-existing local/map-studio-renders"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-mapstudio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-mapstudio-local-only}

volumes:
  redis-data:
  minio-data:
  postgres-data:
